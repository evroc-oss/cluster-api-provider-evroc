{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-api-provider-evroc.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-api-provider-evroc.labels" . | nindent 4 }}
    {{- with .Values.metrics.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "cluster-api-provider-evroc.selectorLabels" . | nindent 4 }}
{{- end }}
