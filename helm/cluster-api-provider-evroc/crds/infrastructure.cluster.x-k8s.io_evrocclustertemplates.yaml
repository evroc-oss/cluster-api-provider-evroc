---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    cluster.x-k8s.io/v1beta1: v1beta1
    cluster.x-k8s.io/v1beta2: v1beta1
    clusterctl.cluster.x-k8s.io: ""
  name: evrocclustertemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: EvrocClusterTemplate
    listKind: EvrocClusterTemplateList
    plural: evrocclustertemplates
    singular: evrocclustertemplate
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          EvrocClusterTemplate is the Schema for the evrocclustertemplates API
          This template is used by ClusterClass to create EvrocCluster instances
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EvrocClusterTemplateSpec defines the desired state of EvrocClusterTemplate
            properties:
              template:
                description: EvrocClusterTemplateResource describes the data needed
                  to create an EvrocCluster from a template
                properties:
                  spec:
                    description: Spec is the specification of the desired behavior
                      of the cluster.
                    properties:
                      additionalLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          AdditionalLabels is an optional set of labels to add to all Evroc resources managed by this cluster.
                          These labels are applied to VMs, disks, IPs, security groups, and other infrastructure.
                          Use these for cost tracking, billing allocation, and resource organization.
                          Example: {"environment": "production", "team": "platform", "cost-center": "engineering"}
                        type: object
                      controlPlaneConfig:
                        description: |-
                          ControlPlaneConfig defines configuration for the control plane endpoint.
                          A load balancer is always created for the control plane.
                          Use this section to customize LB behavior (e.g., bring-your-own LB or IP).
                        properties:
                          loadBalancer:
                            description: |-
                              LoadBalancer allows overriding the auto-created control plane load balancer.
                              If omitted, the controller auto-creates a managed LB with default settings.
                            properties:
                              additionalPorts:
                                description: |-
                                  AdditionalPorts specifies extra TCP ports to forward through the public LB.
                                  Each port gets its own BackendService + L4Route with TCP health check.
                                  The API server port (6443) is always included and does not need to be listed here.
                                  Node registration (e.g. RKE2 supervisor on 9345) happens cluster-internally over
                                  private IPs and does not belong here — open it via an inline security group instead.
                                items:
                                  format: int32
                                  type: integer
                                type: array
                              existingPublicIPID:
                                description: |-
                                  ExistingPublicIPID references a pre-existing public IP to attach to the managed LB.
                                  If omitted, a new public IP is auto-created alongside the LB.
                                type: string
                            type: object
                        type: object
                      controlPlaneEndpoint:
                        description: ControlPlaneEndpoint represents the endpoint
                          used to communicate with the control plane.
                        minProperties: 1
                        properties:
                          host:
                            description: host is the hostname on which the API server
                              is serving.
                            maxLength: 512
                            minLength: 1
                            type: string
                          port:
                            description: port is the port on which the API server
                              is serving.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        type: object
                      credentialsRef:
                        description: |-
                          CredentialsRef is a reference to a Secret in the EvrocCluster namespace
                          containing evroc service account credentials. Cross-namespace references
                          are intentionally unsupported.
                          Required: every cluster must name the credentials it uses.
                          The secret must contain serviceAccountID and serviceAccountSecret, with
                          organization optionally specifying the evroc organization.
                        properties:
                          name:
                            description: Name is the name of the Secret.
                            type: string
                        required:
                        - name
                        type: object
                      failureDomains:
                        description: |-
                          FailureDomains is a list of failure domains (availability zones) in which machines should be placed.
                          This provides high availability by spreading machines across zones.
                          Defaults to ["a", "b", "c"] if not specified.
                        items:
                          type: string
                        type: array
                      network:
                        description: |-
                          Network defines the VPC, subnet, and IP stack configuration for the cluster.
                          When omitted, the project's default VPC with default subnets and dual-stack
                          networking is used.
                        properties:
                          stackType:
                            default: dual-stack
                            description: |-
                              StackType is the IP stack type for the internal cluster network.
                              When "dual-stack", VMs and pods get both IPv4 and IPv6 addresses.
                              When "ipv6-only", VMs get only IPv6 addresses; the LB uses
                              ipProtocolSelection to reach backends over IPv6.
                              The control plane endpoint (load balancer frontend) is always IPv4.
                              Defaults to "dual-stack" if not specified.
                            enum:
                            - ipv4-only
                            - dual-stack
                            - ipv6-only
                            type: string
                          subnetRefs:
                            additionalProperties:
                              type: string
                            description: |-
                              SubnetRefs maps availability zone letters to subnets within the VPC.
                              Key is the zone letter (e.g., "a", "b", "c"), value is the subnet.
                              When VPCRef is set, SubnetRefs should map every zone in FailureDomains to
                              the appropriate subnet. When omitted, the default subnet for each zone is
                              used (default-{region}-{zone}).

                              Each value accepts either a bare subnet name (e.g. "my-subnet-a"),
                              resolved to an FQID within this cluster's project and region, or an
                              already fully-qualified ref, i.e.
                              "/networking/projects/{project}/regions/{region}/subnets/my-subnet-a".
                            type: object
                          vpcRef:
                            description: |-
                              VPCRef references a pre-existing VPC to place all cluster resources in
                              (security groups, VMs, load balancers). The VPC must already exist in the
                              evroc project. When omitted, the project's default VPC is used.

                              Accepts either a bare VPC name (e.g. "my-vpc"), which is resolved to an
                              FQID within this cluster's project and region, or an already
                              fully-qualified ref, i.e.
                              "/networking/projects/{project}/regions/{region}/virtualPrivateClouds/my-vpc".
                            type: string
                        type: object
                      project:
                        description: Project is the evroc project name
                        type: string
                      region:
                        description: |-
                          Region is the evroc region (e.g., "se-sto").
                          Defaults to "se-sto" if not specified.
                        type: string
                      securityGroups:
                        description: |-
                          SecurityGroups defines security group configuration for all nodes in the cluster.
                          Rules are split into three sections: common (all nodes), controlPlane (CP only),
                          and worker (workers only). Machines with inheritFromCluster: true automatically
                          receive the common section plus their role-specific section.
                        properties:
                          common:
                            description: Common security groups applied to ALL nodes
                              (control plane and workers).
                            properties:
                              existingIDs:
                                description: |-
                                  ExistingIDs references pre-existing security groups by their evroc resource ID (e.g., created by Terraform).
                                  These groups will be attached but NOT managed by CAPI - CAPI will not create or delete them.
                                items:
                                  type: string
                                type: array
                              inlineSecurityGroups:
                                description: |-
                                  InlineSecurityGroups defines security groups to auto-create with specified rules.
                                  Each group will be named "<cluster-name>-<cluster-uid>-<group-name>" and tracked in cluster.status.
                                items:
                                  description: InlineSecurityGroup defines a security
                                    group with inline rules for auto-creation.
                                  properties:
                                    name:
                                      description: |-
                                        Name is the logical name for this security group.
                                        The actual resource will be named "<cluster-name>-<cluster-uid>-<name>".
                                      type: string
                                    rules:
                                      description: Rules defines the firewall rules
                                        for this security group.
                                      items:
                                        description: |-
                                          SecurityGroupRule defines a single firewall rule.
                                          This type is used by inline security group configuration on EvrocCluster and EvrocMachine.
                                        properties:
                                          direction:
                                            description: Direction specifies if this
                                              is an Ingress or Egress rule
                                            enum:
                                            - Ingress
                                            - Egress
                                            type: string
                                          endPort:
                                            description: EndPort specifies the end
                                              of a port range
                                            format: int32
                                            type: integer
                                          name:
                                            description: Name is the unique name of
                                              this rule within the security group
                                            type: string
                                          port:
                                            description: Port specifies the port number
                                              (0 means all ports)
                                            format: int32
                                            type: integer
                                          protocol:
                                            description: Protocol specifies the protocol
                                              (TCP, UDP, ICMP, or All)
                                            enum:
                                            - TCP
                                            - UDP
                                            - ICMP
                                            - All
                                            type: string
                                          remoteCIDR:
                                            description: RemoteCIDR specifies the
                                              remote IP address or CIDR block
                                            type: string
                                          remoteSecurityGroup:
                                            description: RemoteSecurityGroup references
                                              another security group
                                            type: string
                                        required:
                                        - direction
                                        - name
                                        type: object
                                      type: array
                                  required:
                                  - name
                                  type: object
                                type: array
                            type: object
                          controlPlane:
                            description: ControlPlane security groups applied only
                              to control plane nodes.
                            properties:
                              existingIDs:
                                description: |-
                                  ExistingIDs references pre-existing security groups by their evroc resource ID (e.g., created by Terraform).
                                  These groups will be attached but NOT managed by CAPI - CAPI will not create or delete them.
                                items:
                                  type: string
                                type: array
                              inlineSecurityGroups:
                                description: |-
                                  InlineSecurityGroups defines security groups to auto-create with specified rules.
                                  Each group will be named "<cluster-name>-<cluster-uid>-<group-name>" and tracked in cluster.status.
                                items:
                                  description: InlineSecurityGroup defines a security
                                    group with inline rules for auto-creation.
                                  properties:
                                    name:
                                      description: |-
                                        Name is the logical name for this security group.
                                        The actual resource will be named "<cluster-name>-<cluster-uid>-<name>".
                                      type: string
                                    rules:
                                      description: Rules defines the firewall rules
                                        for this security group.
                                      items:
                                        description: |-
                                          SecurityGroupRule defines a single firewall rule.
                                          This type is used by inline security group configuration on EvrocCluster and EvrocMachine.
                                        properties:
                                          direction:
                                            description: Direction specifies if this
                                              is an Ingress or Egress rule
                                            enum:
                                            - Ingress
                                            - Egress
                                            type: string
                                          endPort:
                                            description: EndPort specifies the end
                                              of a port range
                                            format: int32
                                            type: integer
                                          name:
                                            description: Name is the unique name of
                                              this rule within the security group
                                            type: string
                                          port:
                                            description: Port specifies the port number
                                              (0 means all ports)
                                            format: int32
                                            type: integer
                                          protocol:
                                            description: Protocol specifies the protocol
                                              (TCP, UDP, ICMP, or All)
                                            enum:
                                            - TCP
                                            - UDP
                                            - ICMP
                                            - All
                                            type: string
                                          remoteCIDR:
                                            description: RemoteCIDR specifies the
                                              remote IP address or CIDR block
                                            type: string
                                          remoteSecurityGroup:
                                            description: RemoteSecurityGroup references
                                              another security group
                                            type: string
                                        required:
                                        - direction
                                        - name
                                        type: object
                                      type: array
                                  required:
                                  - name
                                  type: object
                                type: array
                            type: object
                          worker:
                            description: Worker security groups applied only to worker
                              nodes.
                            properties:
                              existingIDs:
                                description: |-
                                  ExistingIDs references pre-existing security groups by their evroc resource ID (e.g., created by Terraform).
                                  These groups will be attached but NOT managed by CAPI - CAPI will not create or delete them.
                                items:
                                  type: string
                                type: array
                              inlineSecurityGroups:
                                description: |-
                                  InlineSecurityGroups defines security groups to auto-create with specified rules.
                                  Each group will be named "<cluster-name>-<cluster-uid>-<group-name>" and tracked in cluster.status.
                                items:
                                  description: InlineSecurityGroup defines a security
                                    group with inline rules for auto-creation.
                                  properties:
                                    name:
                                      description: |-
                                        Name is the logical name for this security group.
                                        The actual resource will be named "<cluster-name>-<cluster-uid>-<name>".
                                      type: string
                                    rules:
                                      description: Rules defines the firewall rules
                                        for this security group.
                                      items:
                                        description: |-
                                          SecurityGroupRule defines a single firewall rule.
                                          This type is used by inline security group configuration on EvrocCluster and EvrocMachine.
                                        properties:
                                          direction:
                                            description: Direction specifies if this
                                              is an Ingress or Egress rule
                                            enum:
                                            - Ingress
                                            - Egress
                                            type: string
                                          endPort:
                                            description: EndPort specifies the end
                                              of a port range
                                            format: int32
                                            type: integer
                                          name:
                                            description: Name is the unique name of
                                              this rule within the security group
                                            type: string
                                          port:
                                            description: Port specifies the port number
                                              (0 means all ports)
                                            format: int32
                                            type: integer
                                          protocol:
                                            description: Protocol specifies the protocol
                                              (TCP, UDP, ICMP, or All)
                                            enum:
                                            - TCP
                                            - UDP
                                            - ICMP
                                            - All
                                            type: string
                                          remoteCIDR:
                                            description: RemoteCIDR specifies the
                                              remote IP address or CIDR block
                                            type: string
                                          remoteSecurityGroup:
                                            description: RemoteSecurityGroup references
                                              another security group
                                            type: string
                                        required:
                                        - direction
                                        - name
                                        type: object
                                      type: array
                                  required:
                                  - name
                                  type: object
                                type: array
                            type: object
                        type: object
                    required:
                    - credentialsRef
                    - project
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
