# Default values for cluster-api-provider-evroc
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace object rendering.
# Leave `create: false` for Helm installs and rely on
# `helm install --create-namespace`. It is set to true when generating
# templates/infrastructure-components.yaml so clusterctl can infer the provider
# target namespace from the manifest.
namespace:
  create: false

# Controller configuration
controller:
  # Number of controller replicas (only 1 is active, others are standby)
  replicas: 1

  image:
    repository: ghcr.io/evroc-oss/cluster-api-provider-evroc
    tag: v0.4.0
    pullPolicy: IfNotPresent

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Health probe configuration
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # Node selector for controller pod
  nodeSelector: {}

  # Tolerations for controller pod
  # Bootstrap clusters (kind, k3d) and single-node management clusters only
  # have control-plane nodes, which carry the NoSchedule taint. Without this
  # toleration the controller pod cannot be scheduled, blocking clusterctl
  # move and any management operations from those clusters.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule

  # Affinity rules for controller pod
  affinity: {}

  # Additional environment variables
  extraEnv: []

  # Enable leader election for high availability
  leaderElection:
    enabled: true

  # Security context for the controller pod
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # Security context for the controller container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532

# Webhook configuration
webhook:
  # Enable admission webhooks for validation and defaulting
  enabled: true

  # Webhook server port (controller-runtime default)
  port: 9443

  # Certificate directory for webhook TLS
  certDir: /tmp/k8s-webhook-server/serving-certs

  # cert-manager integration
  certManager:
    # Enable cert-manager for automatic certificate management
    enabled: true

    # Issuer to use for webhook certificates
    # The chart will create a self-signed issuer if this is set
    issuerRef:
      kind: Issuer
      name: selfsigned-issuer

# RBAC configuration
rbac:
  # Create RBAC resources
  create: true

# Service Account configuration
serviceAccount:
  # Create service account
  create: true

  # Annotations for service account
  annotations: {}

  # Name of service account (auto-generated if not specified)
  name: ""

# Image pull secrets
imagePullSecrets: []

# Global annotations
annotations: {}

# Global labels
labels: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Logging configuration
logging:
  # Log level (debug, info, warn, error)
  level: info

  # Log format (json or text)
  format: json

# Metrics service configuration
metrics:
  # Enable Prometheus metrics endpoint and Service
  enabled: false

  # Metrics port
  port: 8080

  # Service configuration
  service:
    # Annotations for metrics service
    annotations: {}

    # Labels for metrics service
    labels: {}

  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    # Create ServiceMonitor resource
    enabled: false

    # Scrape interval
    interval: 30s

    # Scrape timeout (must be less than interval)
    scrapeTimeout: 10s

    # Additional labels for ServiceMonitor
    # Use this to match your Prometheus instance's serviceMonitorSelector
    additionalLabels: {}
    # Example:
    # additionalLabels:
    #   prometheus: kube-prometheus

# Enable debug mode
debug: false
