---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    cluster.x-k8s.io/v1beta1: v1beta1
    cluster.x-k8s.io/v1beta2: v1beta1
  name: evrocclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: EvrocCluster
    listKind: EvrocClusterList
    plural: evrocclusters
    singular: evroccluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster
      jsonPath: .metadata.labels['cluster\.x-k8s\.io/cluster-name']
      name: Cluster
      type: string
    - description: Cluster infrastructure is ready
      jsonPath: .status.ready
      name: Ready
      type: boolean
    - description: Control plane endpoint
      jsonPath: .spec.controlPlaneEndpoint.host
      name: Endpoint
      type: string
    - description: Time duration since creation
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: EvrocCluster is the Schema for the evrocclusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EvrocClusterSpec defines the desired state of EvrocCluster
            properties:
              additionalLabels:
                additionalProperties:
                  type: string
                description: |-
                  AdditionalLabels is an optional set of labels to add to all Evroc resources managed by this cluster.
                  These labels are applied to VMs, disks, IPs, security groups, and other infrastructure.
                  Use these for cost tracking, billing allocation, and resource organization.
                  Example: {"environment": "production", "team": "platform", "cost-center": "engineering"}
                type: object
              controlPlaneConfig:
                description: |-
                  ControlPlaneConfig defines networking configuration for control plane nodes.
                  Currently holds public IP configuration for the control plane endpoint.
                properties:
                  publicIP:
                    description: |-
                      PublicIP configuration for the control plane endpoint.
                      When enabled, a public IP will be auto-created and used for ControlPlaneEndpoint.Host.
                    properties:
                      enabled:
                        description: |-
                          Enabled auto-creates a public IP managed by the controller.
                          The IP will be named "<cluster-name>-cp-ip" and tracked in cluster.status.resources.
                          When the cluster is deleted, the IP is automatically cleaned up.
                        type: boolean
                      existingName:
                        description: |-
                          ExistingName references a pre-existing public IP by name (e.g., created by Terraform).
                          The IP is looked up in the evroc project configured via the controller's credentials.
                          This IP will be used but NOT managed by CAPI - CAPI will not create or delete it.
                          Mutually exclusive with Enabled.
                        type: string
                    type: object
                type: object
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint represents the endpoint used to
                  communicate with the control plane.
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              credentialsRef:
                description: |-
                  CredentialsRef is a reference to a Secret containing evroc API credentials.
                  The secret must contain a "config.yaml" key with the evroc SDK config format:
                    auth:
                      token: "..."
                      refresh_token: "..."
                    context:
                      project: "..."
                      region: "..."
                  When omitted the controller falls back to the globally mounted config file.
                properties:
                  name:
                    description: Name is the name of the Secret.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the Secret. Defaults to the namespace of the
                      EvrocCluster if omitted.
                    type: string
                required:
                - name
                type: object
              failureDomains:
                description: |-
                  FailureDomains is a list of failure domains (availability zones) in which machines should be placed.
                  This provides high availability by spreading machines across zones.
                  Defaults to ["a", "b", "c"] if not specified.
                items:
                  type: string
                type: array
              network:
                description: |-
                  NetworkSpec defines the network configuration for the cluster.
                  Currently unused; reserved for future VPC/Subnet integration.
                properties:
                  subnetRef:
                    description: SubnetRef is a reference to an EvrocSubnet resource
                      (future implementation)
                    type: string
                  vpcRef:
                    description: VPCRef is a reference to an EvrocVPC resource (future
                      implementation)
                    type: string
                type: object
              project:
                description: Project is the evroc project name
                type: string
              region:
                description: |-
                  Region is the evroc region (e.g., "se-sto").
                  Defaults to "se-sto" if not specified.
                type: string
              securityGroups:
                description: |-
                  SecurityGroups defines security group configuration for all nodes in the cluster.
                  Rules are split into three sections: common (all nodes), controlPlane (CP only),
                  and worker (workers only). Machines with inheritFromCluster: true automatically
                  receive the common section plus their role-specific section.
                properties:
                  common:
                    description: Common security groups applied to ALL nodes (control
                      plane and workers).
                    properties:
                      existingNames:
                        description: |-
                          ExistingNames references pre-existing security groups by name (e.g., created by Terraform).
                          These groups will be attached but NOT managed by CAPI - CAPI will not create or delete them.
                        items:
                          type: string
                        type: array
                      inlineSecurityGroups:
                        description: |-
                          InlineSecurityGroups defines security groups to auto-create with specified rules.
                          Each group will be named "<cluster-name>-<cluster-uid>-<group-name>" and tracked in cluster.status.
                        items:
                          description: InlineSecurityGroup defines a security group
                            with inline rules for auto-creation.
                          properties:
                            name:
                              description: |-
                                Name is the logical name for this security group.
                                The actual resource will be named "<cluster-name>-<cluster-uid>-<name>".
                              type: string
                            rules:
                              description: Rules defines the firewall rules for this
                                security group.
                              items:
                                description: |-
                                  SecurityGroupRule defines a single firewall rule.
                                  This type is used by inline security group configuration on EvrocCluster and EvrocMachine.
                                properties:
                                  direction:
                                    description: Direction specifies if this is an
                                      Ingress or Egress rule
                                    enum:
                                    - Ingress
                                    - Egress
                                    type: string
                                  endPort:
                                    description: EndPort specifies the end of a port
                                      range
                                    format: int32
                                    type: integer
                                  name:
                                    description: Name is the unique name of this rule
                                      within the security group
                                    type: string
                                  port:
                                    description: Port specifies the port number (0
                                      means all ports)
                                    format: int32
                                    type: integer
                                  protocol:
                                    description: Protocol specifies the protocol (TCP,
                                      UDP, ICMP, or All)
                                    enum:
                                    - TCP
                                    - UDP
                                    - ICMP
                                    - All
                                    type: string
                                  remoteCIDR:
                                    description: RemoteCIDR specifies the remote IP
                                      address or CIDR block
                                    type: string
                                  remoteSecurityGroup:
                                    description: RemoteSecurityGroup references another
                                      security group
                                    type: string
                                required:
                                - direction
                                - name
                                type: object
                              type: array
                          required:
                          - name
                          type: object
                        type: array
                    type: object
                  controlPlane:
                    description: ControlPlane security groups applied only to control
                      plane nodes.
                    properties:
                      existingNames:
                        description: |-
                          ExistingNames references pre-existing security groups by name (e.g., created by Terraform).
                          These groups will be attached but NOT managed by CAPI - CAPI will not create or delete them.
                        items:
                          type: string
                        type: array
                      inlineSecurityGroups:
                        description: |-
                          InlineSecurityGroups defines security groups to auto-create with specified rules.
                          Each group will be named "<cluster-name>-<cluster-uid>-<group-name>" and tracked in cluster.status.
                        items:
                          description: InlineSecurityGroup defines a security group
                            with inline rules for auto-creation.
                          properties:
                            name:
                              description: |-
                                Name is the logical name for this security group.
                                The actual resource will be named "<cluster-name>-<cluster-uid>-<name>".
                              type: string
                            rules:
                              description: Rules defines the firewall rules for this
                                security group.
                              items:
                                description: |-
                                  SecurityGroupRule defines a single firewall rule.
                                  This type is used by inline security group configuration on EvrocCluster and EvrocMachine.
                                properties:
                                  direction:
                                    description: Direction specifies if this is an
                                      Ingress or Egress rule
                                    enum:
                                    - Ingress
                                    - Egress
                                    type: string
                                  endPort:
                                    description: EndPort specifies the end of a port
                                      range
                                    format: int32
                                    type: integer
                                  name:
                                    description: Name is the unique name of this rule
                                      within the security group
                                    type: string
                                  port:
                                    description: Port specifies the port number (0
                                      means all ports)
                                    format: int32
                                    type: integer
                                  protocol:
                                    description: Protocol specifies the protocol (TCP,
                                      UDP, ICMP, or All)
                                    enum:
                                    - TCP
                                    - UDP
                                    - ICMP
                                    - All
                                    type: string
                                  remoteCIDR:
                                    description: RemoteCIDR specifies the remote IP
                                      address or CIDR block
                                    type: string
                                  remoteSecurityGroup:
                                    description: RemoteSecurityGroup references another
                                      security group
                                    type: string
                                required:
                                - direction
                                - name
                                type: object
                              type: array
                          required:
                          - name
                          type: object
                        type: array
                    type: object
                  worker:
                    description: Worker security groups applied only to worker nodes.
                    properties:
                      existingNames:
                        description: |-
                          ExistingNames references pre-existing security groups by name (e.g., created by Terraform).
                          These groups will be attached but NOT managed by CAPI - CAPI will not create or delete them.
                        items:
                          type: string
                        type: array
                      inlineSecurityGroups:
                        description: |-
                          InlineSecurityGroups defines security groups to auto-create with specified rules.
                          Each group will be named "<cluster-name>-<cluster-uid>-<group-name>" and tracked in cluster.status.
                        items:
                          description: InlineSecurityGroup defines a security group
                            with inline rules for auto-creation.
                          properties:
                            name:
                              description: |-
                                Name is the logical name for this security group.
                                The actual resource will be named "<cluster-name>-<cluster-uid>-<name>".
                              type: string
                            rules:
                              description: Rules defines the firewall rules for this
                                security group.
                              items:
                                description: |-
                                  SecurityGroupRule defines a single firewall rule.
                                  This type is used by inline security group configuration on EvrocCluster and EvrocMachine.
                                properties:
                                  direction:
                                    description: Direction specifies if this is an
                                      Ingress or Egress rule
                                    enum:
                                    - Ingress
                                    - Egress
                                    type: string
                                  endPort:
                                    description: EndPort specifies the end of a port
                                      range
                                    format: int32
                                    type: integer
                                  name:
                                    description: Name is the unique name of this rule
                                      within the security group
                                    type: string
                                  port:
                                    description: Port specifies the port number (0
                                      means all ports)
                                    format: int32
                                    type: integer
                                  protocol:
                                    description: Protocol specifies the protocol (TCP,
                                      UDP, ICMP, or All)
                                    enum:
                                    - TCP
                                    - UDP
                                    - ICMP
                                    - All
                                    type: string
                                  remoteCIDR:
                                    description: RemoteCIDR specifies the remote IP
                                      address or CIDR block
                                    type: string
                                  remoteSecurityGroup:
                                    description: RemoteSecurityGroup references another
                                      security group
                                    type: string
                                required:
                                - direction
                                - name
                                type: object
                              type: array
                          required:
                          - name
                          type: object
                        type: array
                    type: object
                type: object
            required:
            - project
            type: object
          status:
            description: EvrocClusterStatus defines the observed state of EvrocCluster
            properties:
              conditions:
                description: Conditions defines current service state of the EvrocCluster.
                items:
                  description: Condition defines an observation of a Cluster API resource
                    operational state.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed. If that is not known, then using the time when
                        the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This field may be empty.
                      maxLength: 10240
                      minLength: 1
                      type: string
                    reason:
                      description: |-
                        reason is the reason for the condition's last transition in CamelCase.
                        The specific API may choose whether or not this field is considered a guaranteed API.
                        This field may be empty.
                      maxLength: 256
                      minLength: 1
                      type: string
                    severity:
                      description: |-
                        severity provides an explicit classification of Reason code, so the users or machines can immediately
                        understand the current situation and act accordingly.
                        The Severity field MUST be set only when Status=False.
                      maxLength: 32
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                        can be useful (see .node.status.conditions), the ability to deconflict is important.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              failureDomains:
                description: |-
                  FailureDomains reports available zones to CAPI's KCP controller for control plane spreading.
                  Required by the InfraCluster contract; KCP reads this from Status, not Spec.
                  Populated by reconcileFailureDomains from Spec.FailureDomains.
                items:
                  description: |-
                    FailureDomain is the Schema for Cluster API failure domains.
                    It allows controllers to understand how many failure domains a cluster can optionally span across.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: attributes is a free form map of attributes an
                        infrastructure provider might use or require.
                      type: object
                    controlPlane:
                      description: controlPlane determines if this failure domain
                        is suitable for use by control plane machines.
                      type: boolean
                    name:
                      description: name is the name of the failure domain.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              initialization:
                description: |-
                  Initialization tracks the status of cluster infrastructure provisioning.
                  This is part of the CAPI v1.12+ contract for orchestrating provisioning.
                properties:
                  infrastructureProvisioned:
                    description: |-
                      InfrastructureProvisioned is the v1beta2 field for forwards compatibility.
                      Both fields should be set to the same value.
                    type: boolean
                  provisioned:
                    description: |-
                      Provisioned is true when the infrastructure is fully provisioned.
                      This is the field that CAPI v1.12 infrastructure contract checks.
                    type: boolean
                type: object
              network:
                description: Network contains information about the cluster's network
                  configuration
                properties:
                  subnetId:
                    description: SubnetID is the ID of the subnet (when implemented)
                    type: string
                  vpcId:
                    description: VPCID is the ID of the VPC (when implemented)
                    type: string
                type: object
              ready:
                description: Ready indicates whether the cluster infrastructure is
                  ready
                type: boolean
              resources:
                description: |-
                  Resources tracks cloud resources created or referenced by this controller.
                  These are cloud resource IDs, not Kubernetes CRDs.
                  Managed resources are automatically cleaned up when the cluster is deleted.
                properties:
                  publicIP:
                    description: |-
                      PublicIP information for the control plane endpoint.
                      Only populated when using inline publicIP configuration (enabled or existingName).
                    properties:
                      address:
                        description: Address is the allocated IPv4 address.
                        type: string
                      id:
                        description: ID is the cloud resource ID (e.g., "my-cluster-cp-ip").
                        type: string
                      managed:
                        description: |-
                          Managed indicates whether CAPI created and owns this resource.
                          True: CAPI created it, will delete it on cluster deletion.
                          False: External resource (e.g., Terraform), CAPI only uses it.
                        type: boolean
                      name:
                        description: Name is the cloud resource name.
                        type: string
                    required:
                    - address
                    - id
                    - managed
                    - name
                    type: object
                  securityGroups:
                    description: SecurityGroups created or used for this cluster.
                    items:
                      description: ManagedSecurityGroup tracks a security group resource
                        used by the cluster.
                      properties:
                        id:
                          description: ID is the cloud resource ID.
                          type: string
                        managed:
                          description: |-
                            Managed indicates whether CAPI created and owns this resource.
                            True: CAPI created it, will delete it on cluster deletion.
                            False: External resource (e.g., Terraform), CAPI only uses it.
                          type: boolean
                        name:
                          description: Name is the cloud resource name.
                          type: string
                        role:
                          description: |-
                            Role indicates which section this SG belongs to: "common", "controlPlane", or "worker".
                            Used by the machine controller to select the right SGs based on node role.
                          type: string
                      required:
                      - id
                      - managed
                      - name
                      - role
                      type: object
                    type: array
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
