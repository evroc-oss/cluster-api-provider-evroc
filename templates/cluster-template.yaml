# Default cluster template for evroc CAPI provider (kubeadm)
#
# This is a starter template. The default kubeadm flavor ships Cilium as the CNI
# with simple, reliable defaults for a cloud VPC: VXLAN tunnel routing, which
# works across VPC subnets and zones without coordinating a native-routing pod
# CIDR. kube-proxy is left in place. Advanced tuning (e.g. kube-proxy
# replacement, native routing) belongs in your own manifests once you outgrow
# the starter template.
#
# Cilium is installed automatically via postKubeadmCommands on the first control
# plane node using the pinned Cilium CLI. To pin a different Cilium version set
# CILIUM_VERSION; the CLI version is CILIUM_CLI_VERSION.
#
# Prefer Calico instead? Use --flavor calico (cluster-template-calico.yaml).
#
# Required environment variables:
#   CLUSTER_NAME: Name of the cluster
#   EVROC_PROJECT: evroc project ID
#   EVROC_SSH_KEY: SSH public key used for node access
#
# Optional environment variables:
#   EVROC_REGION: evroc region (default: se-sto)
#   CONTROL_PLANE_MACHINE_COUNT: Number of control plane nodes (default: 3)
#   WORKER_MACHINE_COUNT: Number of worker nodes (default: 3)
#   KUBERNETES_VERSION: Kubernetes version (default: v1.28.0)
#   EVROC_CONTROL_PLANE_COMPUTE_PROFILE: Control plane VM compute profile (default: a1a.m)
#   EVROC_WORKER_COMPUTE_PROFILE: Worker VM compute profile (default: a1a.m)
#   EVROC_IMAGE: OS image (default: ubuntu.22-04.1)
#   EVROC_ALLOWED_CIDR: Source CIDR for SSH and API access (default: 0.0.0.0/0)
#   POD_CIDR: Pod CIDR (default: 10.244.0.0/16)
#   SERVICE_CIDR: Service CIDR (default: 10.96.0.0/12)
#
# Note: This template uses failureDomains [a, b, c] for multi-zone
# distribution. Region labels are set via kubeletExtraArgs, but zone
# labels are NOT set because CAPI assigns zones dynamically via
# failureDomains. Zone labels require an evroc Cloud Controller Manager
# (CCM). If your CSI driver needs zone labels, use per-zone
# MachineDeployments (see README.md "Topology Labels" section).

apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE:=default}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - ${POD_CIDR:=10.244.0.0/16}
    services:
      cidrBlocks:
      - ${SERVICE_CIDR:=10.96.0.0/12}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: EvrocCluster
    name: ${CLUSTER_NAME}
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE:=default}
spec:
  project: ${EVROC_PROJECT}
  region: ${EVROC_REGION:=se-sto}
  # Endpoint overrides for private/non-production evroc deployments.
  # Leave unset to use the public evroc cloud.
  endpoints:
    apiBaseURL: "${EVROC_API_BASE_URL:=}"
    issuerURL: "${EVROC_ISSUER_URL:=}"
  # The credential Secret must be in the same namespace as this EvrocCluster.
  credentialsRef:
    name: "${EVROC_CREDENTIALS_SECRET}"
  failureDomains:
  - a
  - b
  - c
  securityGroups:
    common:
      inlineSecurityGroups:
      - name: common-sg
        rules:
        - name: ssh
          direction: Ingress
          protocol: TCP
          port: 22
          remoteCIDR: "${EVROC_ALLOWED_CIDR:=0.0.0.0/0}"
        - name: kubelet
          direction: Ingress
          protocol: TCP
          port: 10250
          remoteCIDR: "10.0.0.0/8"
        # Broad internal rule — covers all intra-cluster traffic (pods, services, etc.)
        - name: cluster-internal
          direction: Ingress
          protocol: All
          remoteCIDR: "10.0.0.0/8"
        - name: allow-all-egress
          direction: Egress
          protocol: All
          remoteCIDR: "0.0.0.0/0"
    controlPlane:
      inlineSecurityGroups:
      - name: control-plane-sg
        rules:
        - name: k8s-api
          direction: Ingress
          protocol: TCP
          port: 6443
          remoteCIDR: "${EVROC_ALLOWED_CIDR:=0.0.0.0/0}"
        - name: etcd-client
          direction: Ingress
          protocol: TCP
          port: 2379
          remoteCIDR: "10.0.0.0/8"
        - name: etcd-peer
          direction: Ingress
          protocol: TCP
          port: 2380
          remoteCIDR: "10.0.0.0/8"
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: ${NAMESPACE:=default}
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: ${KUBERNETES_VERSION}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: EvrocMachineTemplate
        name: ${CLUSTER_NAME}-control-plane
  kubeadmConfigSpec:
    preKubeadmCommands:
      - modprobe overlay
      - modprobe br_netfilter
      - |
        cat <<EOF > /etc/sysctl.d/k8s.conf
        net.bridge.bridge-nf-call-iptables = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward = 1
        EOF
      - sysctl --system
      - apt-get update -y
      - apt-get install -y apt-transport-https ca-certificates curl gpg containerd conntrack
      - mkdir -p /etc/containerd
      - containerd config default > /etc/containerd/config.toml
      - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      - systemctl restart containerd
      - systemctl enable containerd
      - mkdir -p -m 755 /etc/apt/keyrings
      - 'KUBE_MINOR=$(echo "${KUBERNETES_VERSION}" | cut -d. -f1,2) && curl -fsSL "https://pkgs.k8s.io/core:/stable:/$KUBE_MINOR/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg'
      - 'KUBE_MINOR=$(echo "${KUBERNETES_VERSION}" | cut -d. -f1,2) && echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/$KUBE_MINOR/deb/ /" > /etc/apt/sources.list.d/kubernetes.list'
      - apt-get update -y
      - |
        KUBE_VERSION=$(echo "${KUBERNETES_VERSION}" | sed 's/^v//')
        HOST_ARCH=$(dpkg --print-architecture)
        KUBE_PKG_VER=$(apt list -a kubelet 2>/dev/null | awk -v arch="$HOST_ARCH" -v v="^$KUBE_VERSION-" '$3==arch && $2 ~ v {print $2; exit}')
        test -n "$KUBE_PKG_VER" || { echo "Kubernetes ${KUBERNETES_VERSION} not found in pkgs.k8s.io channel" >&2; exit 1; }
        apt-get install -y kubelet=$KUBE_PKG_VER kubeadm=$KUBE_PKG_VER kubectl=$KUBE_PKG_VER
      - systemctl enable kubelet
    initConfiguration:
      localAPIEndpoint:
        advertiseAddress: "0.0.0.0"
        bindPort: 6443
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
        - name: node-labels
          value: "topology.kubernetes.io/region=${EVROC_REGION:=se-sto}"
    joinConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
        - name: node-labels
          value: "topology.kubernetes.io/region=${EVROC_REGION:=se-sto}"
    postKubeadmCommands:
      - |
        # Install Cilium once, from the first control plane node only.
        if [ ! -f /etc/kubernetes/manifests/kube-apiserver.yaml ]; then exit 0; fi
        export KUBECONFIG=/etc/kubernetes/admin.conf
        if kubectl get daemonset -n kube-system cilium 2>/dev/null; then exit 0; fi

        CILIUM_CLI_VERSION="${CILIUM_CLI_VERSION:=v0.16.24}"
        CILIUM_VERSION="${CILIUM_VERSION:=1.16.5}"
        CLI_ARCH=amd64
        curl -fsSL --retry 5 -o /tmp/cilium.tar.gz \
          "https://github.com/cilium/cilium-cli/releases/download/$CILIUM_CLI_VERSION/cilium-linux-$CLI_ARCH.tar.gz"
        tar -C /usr/local/bin -xzf /tmp/cilium.tar.gz
        rm -f /tmp/cilium.tar.gz

        # Starter defaults: kube-proxy stays in place and Cilium uses VXLAN tunnel
        # routing, which works across VPC subnets/zones without a native-routing
        # pod CIDR. Tune (e.g. kube-proxy replacement) in your own manifests once
        # you outgrow the starter template.
        cilium install --version "$CILIUM_VERSION" \
          --set routingMode=tunnel \
          --set tunnelProtocol=vxlan \
          --set ipam.mode=kubernetes
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: ${NAMESPACE:=default}
spec:
  template:
    spec:
      project: ${EVROC_PROJECT}
      region: ${EVROC_REGION:=se-sto}
      computeProfile: ${EVROC_CONTROL_PLANE_COMPUTE_PROFILE:=a1a.m}
      image: ${EVROC_IMAGE:=ubuntu.22-04.1}
      rootDiskSize: ${EVROC_CONTROL_PLANE_DISK_SIZE:=100}
      sshKey: "${EVROC_SSH_KEY:=}"
      networkingConfig:
        securityGroups:
          inheritFromCluster: true
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE:=default}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT}
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: EvrocMachineTemplate
        name: ${CLUSTER_NAME}-md-0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE:=default}
spec:
  template:
    spec:
      project: ${EVROC_PROJECT}
      region: ${EVROC_REGION:=se-sto}
      computeProfile: ${EVROC_WORKER_COMPUTE_PROFILE:=a1a.m}
      image: ${EVROC_IMAGE:=ubuntu.22-04.1}
      rootDiskSize: ${EVROC_WORKER_DISK_SIZE:=100}
      sshKey: "${EVROC_SSH_KEY:=}"
      networkingConfig:
        securityGroups:
          inheritFromCluster: true
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE:=default}
spec:
  template:
    spec:
      preKubeadmCommands:
        - modprobe overlay
        - modprobe br_netfilter
        - |
          cat <<EOF > /etc/sysctl.d/k8s.conf
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
          EOF
        - sysctl --system
        - apt-get update -y
        - apt-get install -y apt-transport-https ca-certificates curl gpg containerd conntrack
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        - systemctl restart containerd
        - systemctl enable containerd
        - mkdir -p -m 755 /etc/apt/keyrings
        - 'KUBE_MINOR=$(echo "${KUBERNETES_VERSION}" | cut -d. -f1,2) && curl -fsSL "https://pkgs.k8s.io/core:/stable:/$KUBE_MINOR/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg'
        - 'KUBE_MINOR=$(echo "${KUBERNETES_VERSION}" | cut -d. -f1,2) && echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/$KUBE_MINOR/deb/ /" > /etc/apt/sources.list.d/kubernetes.list'
        - apt-get update -y
        - |
          KUBE_VERSION=$(echo "${KUBERNETES_VERSION}" | sed 's/^v//')
          HOST_ARCH=$(dpkg --print-architecture)
          KUBE_PKG_VER=$(apt list -a kubelet 2>/dev/null | awk -v arch="$HOST_ARCH" -v v="^$KUBE_VERSION-" '$3==arch && $2 ~ v {print $2; exit}')
          test -n "$KUBE_PKG_VER" || { echo "Kubernetes ${KUBERNETES_VERSION} not found in pkgs.k8s.io channel" >&2; exit 1; }
          apt-get install -y kubelet=$KUBE_PKG_VER kubeadm=$KUBE_PKG_VER kubectl=$KUBE_PKG_VER
        - systemctl enable kubelet
      joinConfiguration:
        nodeRegistration:
          criSocket: unix:///var/run/containerd/containerd.sock
          kubeletExtraArgs:
          - name: node-labels
            value: "topology.kubernetes.io/region=${EVROC_REGION:=se-sto}"
