# High Availability Cluster Template with Load Balancer (--flavor ha-lb)
#
# This template provides HA for the Kubernetes API server by placing a
# cloud L4 load balancer in front of all control plane nodes:
# - Traffic distribution across all CP nodes
# - Automatic failover when a CP node dies (LB routes around it)
#
# Technical configuration:
# - Load-balanced control plane with etcd quorum
# - All 3 availability zones (a, b, c)
# - Automatic zone distribution via failureDomains
# - TCP health checks on port 6443 (10s interval, 3 unhealthy threshold)
#
# Required environment variables:
#   CLUSTER_NAME: Name of the cluster
#   EVROC_PROJECT: evroc project ID
#   EVROC_CREDENTIALS_SECRET: Name of the credentials Secret
#   EVROC_SSH_KEY: SSH public key used for node access
#   EVROC_ALLOWED_CIDR: Source CIDR for SSH and API access
#
# Optional environment variables:
#   EVROC_REGION: evroc region (default: se-sto)
#   EVROC_API_BASE_URL: API base URL override
#   EVROC_ISSUER_URL: OIDC issuer URL override
#   CONTROL_PLANE_MACHINE_COUNT: Number of control plane nodes (default: 3)
#   WORKER_MACHINE_COUNT: Number of worker nodes (default: 3)
#   KUBERNETES_VERSION: Kubernetes version (required; example: v1.31.14)
#   EVROC_CONTROL_PLANE_COMPUTE_PROFILE: Control plane VM flavor (default: a1a.l)
#   EVROC_WORKER_COMPUTE_PROFILE: Worker VM flavor (default: a1a.m)
#   EVROC_IMAGE: OS image (default: ubuntu.24-04.1)

apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE:=default}
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: EvrocCluster
    name: ${CLUSTER_NAME}
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE:=default}
spec:
  project: ${EVROC_PROJECT}
  region: ${EVROC_REGION:=se-sto}
  # Endpoint overrides for private/non-production evroc deployments.
  # Leave unset to use the public evroc cloud.
  endpoints:
    apiBaseURL: "${EVROC_API_BASE_URL:=}"
    issuerURL: "${EVROC_ISSUER_URL:=}"
  credentialsRef:
    name: "${EVROC_CREDENTIALS_SECRET}"
  failureDomains:
  - a
  - b
  - c
  securityGroups:
    common:
      inlineSecurityGroups:
      - name: common-sg
        rules:
        - name: ssh
          direction: Ingress
          protocol: TCP
          port: 22
          remoteCIDR: "${EVROC_ALLOWED_CIDR}"
        - name: kubelet
          direction: Ingress
          protocol: TCP
          port: 10250
          remoteCIDR: "${EVROC_VPC_CIDR:=10.0.0.0/8}"
        - name: cluster-internal
          direction: Ingress
          protocol: All
          remoteCIDR: "${EVROC_VPC_CIDR:=10.0.0.0/8}"
        - name: allow-all-egress
          direction: Egress
          protocol: All
          remoteCIDR: "0.0.0.0/0"
    controlPlane:
      inlineSecurityGroups:
      - name: ha-lb-cp-sg
        rules:
        - name: k8s-api
          direction: Ingress
          protocol: TCP
          port: 6443
          remoteCIDR: "${EVROC_ALLOWED_CIDR}"
        - name: etcd
          direction: Ingress
          protocol: TCP
          port: 2379
          endPort: 2380
          remoteCIDR: "${EVROC_VPC_CIDR:=10.0.0.0/8}"
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: ${NAMESPACE:=default}
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: ${KUBERNETES_VERSION}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: EvrocMachineTemplate
        name: ${CLUSTER_NAME}-control-plane
  kubeadmConfigSpec:
    preKubeadmCommands:
      - modprobe overlay
      - modprobe br_netfilter
      - |
        cat <<EOF > /etc/sysctl.d/k8s.conf
        net.bridge.bridge-nf-call-iptables = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward = 1
        EOF
      - sysctl --system
      - apt-get update -y
      - apt-get install -y apt-transport-https ca-certificates curl gpg containerd conntrack
      - mkdir -p /etc/containerd
      - containerd config default > /etc/containerd/config.toml
      - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      - systemctl restart containerd
      - systemctl enable containerd
      - mkdir -p -m 755 /etc/apt/keyrings
      - 'KUBE_MINOR=$(echo "${KUBERNETES_VERSION}" | cut -d. -f1,2) && curl -fsSL "https://pkgs.k8s.io/core:/stable:/$KUBE_MINOR/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg'
      - 'KUBE_MINOR=$(echo "${KUBERNETES_VERSION}" | cut -d. -f1,2) && echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/$KUBE_MINOR/deb/ /" > /etc/apt/sources.list.d/kubernetes.list'
      - apt-get update -y
      - |
        KUBE_VERSION=$(echo "${KUBERNETES_VERSION}" | sed 's/^v//')
        HOST_ARCH=$(dpkg --print-architecture)
        KUBE_PKG_VER=$(apt list -a kubelet 2>/dev/null | awk -v arch="$HOST_ARCH" -v v="^$KUBE_VERSION-" '$3==arch && $2 ~ v {print $2; exit}')
        test -n "$KUBE_PKG_VER" || { echo "Kubernetes ${KUBERNETES_VERSION} not found in pkgs.k8s.io channel" >&2; exit 1; }
        apt-get install -y kubelet=$KUBE_PKG_VER kubeadm=$KUBE_PKG_VER kubectl=$KUBE_PKG_VER
      - systemctl enable kubelet
    initConfiguration:
      localAPIEndpoint:
        advertiseAddress: "0.0.0.0"
        bindPort: 6443
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
        - name: node-labels
          value: "topology.kubernetes.io/region=${EVROC_REGION:=se-sto}"
    joinConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
        - name: node-labels
          value: "topology.kubernetes.io/region=${EVROC_REGION:=se-sto}"
    postKubeadmCommands:
      - |
        if [ ! -f /etc/kubernetes/manifests/kube-apiserver.yaml ]; then exit 0; fi
        if kubectl --kubeconfig /etc/kubernetes/admin.conf get daemonset -n kube-system calico-node 2>/dev/null; then exit 0; fi
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: ${NAMESPACE:=default}
spec:
  template:
    spec:
      project: ${EVROC_PROJECT}
      region: ${EVROC_REGION:=se-sto}
      computeProfile: ${EVROC_CONTROL_PLANE_COMPUTE_PROFILE:=a1a.l}
      image: ${EVROC_IMAGE:=ubuntu.24-04.1}
      rootDiskSize: ${EVROC_CONTROL_PLANE_DISK_SIZE:=200}
      sshKey: "${EVROC_SSH_KEY:=}"
      networkingConfig:
        securityGroups:
          inheritFromCluster: true
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${NAMESPACE:=default}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT}
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: EvrocMachineTemplate
        name: ${CLUSTER_NAME}-workers
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${NAMESPACE:=default}
spec:
  template:
    spec:
      project: ${EVROC_PROJECT}
      region: ${EVROC_REGION:=se-sto}
      computeProfile: ${EVROC_WORKER_COMPUTE_PROFILE:=a1a.m}
      image: ${EVROC_IMAGE:=ubuntu.24-04.1}
      rootDiskSize: ${EVROC_WORKER_DISK_SIZE:=100}
      sshKey: "${EVROC_SSH_KEY:=}"
      networkingConfig:
        securityGroups:
          inheritFromCluster: true
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-workers
  namespace: ${NAMESPACE:=default}
spec:
  template:
    spec:
      preKubeadmCommands:
        - modprobe overlay
        - modprobe br_netfilter
        - |
          cat <<EOF > /etc/sysctl.d/k8s.conf
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
          EOF
        - sysctl --system
        - apt-get update -y
        - apt-get install -y apt-transport-https ca-certificates curl gpg containerd conntrack
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        - systemctl restart containerd
        - systemctl enable containerd
        - mkdir -p -m 755 /etc/apt/keyrings
        - 'KUBE_MINOR=$(echo "${KUBERNETES_VERSION}" | cut -d. -f1,2) && curl -fsSL "https://pkgs.k8s.io/core:/stable:/$KUBE_MINOR/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg'
        - 'KUBE_MINOR=$(echo "${KUBERNETES_VERSION}" | cut -d. -f1,2) && echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/$KUBE_MINOR/deb/ /" > /etc/apt/sources.list.d/kubernetes.list'
        - apt-get update -y
        - |
          KUBE_VERSION=$(echo "${KUBERNETES_VERSION}" | sed 's/^v//')
          HOST_ARCH=$(dpkg --print-architecture)
          KUBE_PKG_VER=$(apt list -a kubelet 2>/dev/null | awk -v arch="$HOST_ARCH" -v v="^$KUBE_VERSION-" '$3==arch && $2 ~ v {print $2; exit}')
          test -n "$KUBE_PKG_VER" || { echo "Kubernetes ${KUBERNETES_VERSION} not found in pkgs.k8s.io channel" >&2; exit 1; }
          apt-get install -y kubelet=$KUBE_PKG_VER kubeadm=$KUBE_PKG_VER kubectl=$KUBE_PKG_VER
        - systemctl enable kubelet
      joinConfiguration:
        nodeRegistration:
          criSocket: unix:///var/run/containerd/containerd.sock
          kubeletExtraArgs:
          - name: node-labels
            value: "topology.kubernetes.io/region=${EVROC_REGION:=se-sto}"
