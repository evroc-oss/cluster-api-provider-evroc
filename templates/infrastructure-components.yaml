                                        type: object
                                      type: array
                                  required:
                                  - name
                                  type: object
                                type: array
                            type: object
                          worker:
                            description: Worker security groups applied only to worker
                              nodes.
                            properties:
                              existingIDs:
                                description: |-
                                  ExistingIDs references pre-existing security groups by their evroc resource ID (e.g., created by Terraform).
