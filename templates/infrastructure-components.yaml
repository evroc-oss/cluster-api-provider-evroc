  name: cluster-api-provider-evroc-validating-webhook-configuration
  labels:
    helm.sh/chart: cluster-api-provider-evroc-0.3.3
    app.kubernetes.io/name: cluster-api-provider-evroc
    app.kubernetes.io/instance: cluster-api-provider-evroc
    control-plane: controller-manager
    app.kubernetes.io/version: "0.3.3"
    app.kubernetes.io/managed-by: Helm
    cluster.x-k8s.io/provider: infrastructure-evroc
  annotations:
    cert-manager.io/inject-ca-from: capi-evroc-system/cluster-api-provider-evroc-serving-cert
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: cluster-api-provider-evroc-webhook-service
      namespace: capi-evroc-system
      path: /validate-infrastructure-cluster-x-k8s-io-v1beta1-evroccluster
  failurePolicy: Fail
  name: vevroccluster.kb.io
  rules:
  - apiGroups:
    - infrastructure.cluster.x-k8s.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - evrocclusters
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: cluster-api-provider-evroc-webhook-service
      namespace: capi-evroc-system
      path: /validate-infrastructure-cluster-x-k8s-io-v1beta1-evrocmachine
  failurePolicy: Fail
  name: vevrocmachine.kb.io
  rules:
  - apiGroups:
    - infrastructure.cluster.x-k8s.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - evrocmachines
  sideEffects: None
