apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-api-provider-evroc-controller-manager
  namespace: capi-evroc-system
  labels:
    helm.sh/chart: cluster-api-provider-evroc-0.3.3
    app.kubernetes.io/name: cluster-api-provider-evroc
    app.kubernetes.io/instance: cluster-api-provider-evroc
    control-plane: controller-manager
    app.kubernetes.io/version: "0.3.3"
    app.kubernetes.io/managed-by: Helm
    cluster.x-k8s.io/provider: infrastructure-evroc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-api-provider-evroc
      app.kubernetes.io/instance: cluster-api-provider-evroc
      control-plane: controller-manager
  template:
    metadata:
      annotations:
      labels:
        app.kubernetes.io/name: cluster-api-provider-evroc
        app.kubernetes.io/instance: cluster-api-provider-evroc
        control-plane: controller-manager
    spec:
      serviceAccountName: cluster-api-provider-evroc-controller-manager
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "ghcr.io/evroc-oss/cluster-api-provider-evroc:v0.3.3"
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --webhook-port=9443
        - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        ports:
        - containerPort: 8081
          name: healthz
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: cluster-api-provider-evroc-webhook-server-cert
