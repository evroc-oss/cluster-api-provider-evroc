# RKE2 Cluster with RKE2's Built-in Cloud Controller (Rancher-style)
# 1 control plane node and 2 worker nodes on SUSE Linux Enterprise Micro 6.1.
#
# This is how Rancher provisions RKE2: the embedded cloud-controller-manager
# stays enabled and assigns rke2://<hostname> node providerIDs. The
# external-cloud-provider annotation on the EvrocCluster makes the evroc
# provider adopt those providerIDs instead of writing its own, so no CCM has
# to be disabled or installed. Compare rke2-rancher-ccm-cluster.yaml, where the
# built-in CCM is disabled and the evroc provider owns providerIDs.
#
# Compatible with CAPI v1.12.x and CAPRKE2 v0.24.x; requires provider v0.5.3+.
#
# Usage:
#   1. Update the values below (project, region, ssh key)
#   2. kubectl apply -f examples/rke2-rancher-ccm-cluster.yaml
#   3. Watch: kubectl get cluster,machines -w
#   4. Get kubeconfig when ready: clusterctl get kubeconfig rke2-rancher-ccm > rke2-rancher-ccm.kubeconfig

---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: rke2-rancher-ccm
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.42.0.0/16
    services:
      cidrBlocks:
        - 10.43.0.0/16
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: RKE2ControlPlane
    name: rke2-rancher-ccm-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: EvrocCluster
    name: rke2-rancher-ccm

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocCluster
metadata:
  name: rke2-rancher-ccm
  namespace: default
  annotations:
    # RKE2's built-in CCM owns the node: it sets spec.providerID and clears the
    # cloud-provider taint. The evroc provider adopts the providerID it assigns.
    infrastructure.cluster.x-k8s.io/external-cloud-provider: "true"
spec:
  project: evroc-demo  # CHANGE THIS to your project
  region: se-sto
  # Credentials for this cluster (required).
  credentialsRef:
    name: evroc-credentials
  failureDomains:
  - a
  - b
  - c
  securityGroups:
    common:
      inlineSecurityGroups:
        - name: common-sg
          rules:
            - name: ssh
              direction: Ingress
              protocol: TCP
              port: 22
              remoteCIDR: 0.0.0.0/0 # Example only; restrict to your trusted source CIDR
            - name: allow-all-egress
              direction: Egress
              protocol: All
              remoteCIDR: 0.0.0.0/0
    controlPlane:
      inlineSecurityGroups:
        - name: cp-sg
          rules:
            - name: kubernetes-api
              direction: Ingress
              protocol: TCP
              port: 6443
              remoteCIDR: 0.0.0.0/0 # Example only; restrict to your trusted source CIDR
            - name: rke2-supervisor
              direction: Ingress
              protocol: TCP
              port: 9345
              remoteCIDR: 0.0.0.0/0
    worker:
      inlineSecurityGroups:
        - name: worker-sg
          rules:
            - name: kubelet
              direction: Ingress
              protocol: TCP
              port: 10250
              remoteCIDR: "10.0.0.0/8"
            - name: canal-vxlan
              direction: Ingress
              protocol: UDP
              port: 8472
              remoteCIDR: "10.0.0.0/8"
            - name: nodeport-tcp
              direction: Ingress
              protocol: TCP
              port: 30000
              endPort: 32767
              remoteCIDR: "0.0.0.0/0"
            - name: nodeport-udp
              direction: Ingress
              protocol: UDP
              port: 30000
              endPort: 32767
              remoteCIDR: "0.0.0.0/0"

---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: RKE2ControlPlane
metadata:
  name: rke2-rancher-ccm-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.35.8+rke2r1
  # Nodes register with the control plane over their private VPC addresses.
  # Without this, RKE2 agents wait on the control plane's public LB and fail to join.
  registrationMethod: internal-first
  serverConfig:
    cni: canal
    # No cloudProviderName: RKE2 then runs its embedded CCM (the Rancher
    # default), which sets rke2:// providerIDs and initializes nodes. Setting
    # cloudProviderName: external would disable it and leave nodes tainted.
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: EvrocMachineTemplate
        name: rke2-rancher-ccm-control-plane
  # Canal CNI configuration
  manifestsConfigMapReference:
    name: rke2-canal-config
    namespace: default
  preRKE2Commands:
    # Load kernel modules immediately
    - modprobe overlay
    - modprobe br_netfilter
    # Persist kernel modules across reboots
    - |
      cat <<MODULES > /etc/modules-load.d/rke2.conf
      overlay
      br_netfilter
      MODULES
    # Configure sysctl
    - |
      cat <<SYSCTL > /etc/sysctl.d/90-rke2.conf
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
      SYSCTL
    # Apply sysctl settings
    - sysctl --system

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocMachineTemplate
metadata:
  name: rke2-rancher-ccm-control-plane
  namespace: default
spec:
  template:
    spec:
      project: evroc-demo  # CHANGE THIS to your project
      region: se-sto
      image: sl-micro.6-1.1
      computeProfile: a1a.m
      rootDiskSize: 100
      sshKey: my-ssh-key  # CHANGE THIS to your SSH key name
      networkingConfig:
        securityGroups:
          inheritFromCluster: true

---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: rke2-rancher-ccm-workers
  namespace: default
spec:
  clusterName: rke2-rancher-ccm
  replicas: 2
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: rke2-rancher-ccm
      version: v1.35.8+rke2r1
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: RKE2ConfigTemplate
          name: rke2-rancher-ccm-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: EvrocMachineTemplate
        name: rke2-rancher-ccm-workers

---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: RKE2ConfigTemplate
metadata:
  name: rke2-rancher-ccm-workers
  namespace: default
spec:
  template:
    spec:
      preRKE2Commands:
        # Load kernel modules immediately
        - modprobe overlay
        - modprobe br_netfilter
        # Persist kernel modules across reboots
        - |
          cat <<MODULES > /etc/modules-load.d/rke2.conf
          overlay
          br_netfilter
          MODULES
        # Configure sysctl
        - |
          cat <<SYSCTL > /etc/sysctl.d/90-rke2.conf
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
          net.ipv4.conf.all.forwarding = 1
          SYSCTL
        # Apply sysctl settings
        - sysctl --system

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: EvrocMachineTemplate
metadata:
  name: rke2-rancher-ccm-workers
  namespace: default
spec:
  template:
    spec:
      project: evroc-demo  # CHANGE THIS to your project
      region: se-sto
      image: sl-micro.6-1.1
      computeProfile: a1a.m
      rootDiskSize: 100
      sshKey: my-ssh-key  # CHANGE THIS to your SSH key name
      networkingConfig:
        securityGroups:
          inheritFromCluster: true

---
# Canal CNI Configuration
# Flannel auto-detects the primary interface via default route
apiVersion: v1
kind: ConfigMap
metadata:
  name: rke2-canal-config
  namespace: default
data:
  rke2-canal-config.yaml: |
    apiVersion: helm.cattle.io/v1
    kind: HelmChartConfig
    metadata:
      name: rke2-canal
      namespace: kube-system
    spec:
      valuesContent: |-
        flannel:
          backend: vxlan
