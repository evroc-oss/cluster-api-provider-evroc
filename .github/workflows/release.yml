name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: read

jobs:
  # Build and test the Go binary
  build:
    name: Build Manager Binary
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/evroc-oss
      GOSUMDB: off
    steps:
      # GitHub official action: Clones the repository code
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # GitHub official action: Installs Go programming language
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'

      - name: Verify tag, release metadata, manifests, and changelog
        run: |
          ./scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      # GitHub official action: Caches Go dependencies to speed up builds
      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: |
          make test

      - name: Build binary
        run: |
          make build

      # GitHub official action: Saves built binary as downloadable artifact
      - name: Upload binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cluster-api-provider-evroc-manager
          path: bin/manager
          retention-days: 7

  # Build and push Docker image to GHCR
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build_push.outputs.digest }}
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      # GitHub official action: Clones the repository code
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Docker official action: Sets up Docker Buildx for advanced image building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Docker official action: Authenticates to GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NO_V=${VERSION#v}" >> $GITHUB_OUTPUT

      # Docker official action: Builds Docker image and pushes to GHCR
      # Note: Uses GO_MODULES_TOKEN to access private evroc-go-sdk repo
      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.VERSION }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          secrets: |
            github_token=${{ secrets.GO_MODULES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sigstore official action: Installs Cosign for signing container images
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker image with Cosign (keyless)
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          echo "Signing image with digest: ${DIGEST}"
          cosign sign --yes ghcr.io/${{ github.repository }}@${DIGEST}

      # Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/${{ github.repository }}@${DIGEST}

      - name: Generate SLSA provenance attestation
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          # Create provenance predicate
          cat > provenance.json <<EOF
          {
            "buildType": "https://github.com/evroc-oss/cluster-api-provider-evroc/blob/main/.github/workflows/release.yml@refs/tags/${{ steps.get_version.outputs.VERSION }}",
            "builder": {
              "id": "https://github.com/actions/runner"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                },
                "entryPoint": ".github/workflows/release.yml"
              }
            },
            "metadata": {
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "buildFinishedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": {
                "parameters": true,
                "environment": false,
                "materials": false
              },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                }
              }
            ]
          }
          EOF

          cosign attest --yes --predicate provenance.json --type slsaprovenance ghcr.io/${{ github.repository }}@${DIGEST}

  # Package Helm chart and create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Azure/Microsoft official action: Installs Helm package manager for Kubernetes
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '3.16.3'

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NO_V=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Update Chart.yaml version and appVersion
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          sed -i "s/^version:.*/version: ${VERSION}/" helm/cluster-api-provider-evroc/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" helm/cluster-api-provider-evroc/Chart.yaml

      - name: Update image tag in values.yaml
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sed -i "s/tag:.*/tag: ${VERSION}/" helm/cluster-api-provider-evroc/values.yaml

      - name: Package Helm chart
        run: |
          cd helm
          helm package cluster-api-provider-evroc
          cd ..

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Helm chart package
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          cd helm
          cosign sign-blob --yes cluster-api-provider-evroc-${VERSION}.tgz --bundle cluster-api-provider-evroc-${VERSION}.tgz.bundle
          cd ..

      - name: Generate clusterctl metadata
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          mkdir -p clusterctl-metadata
          cat > clusterctl-metadata/metadata.yaml <<EOF
          apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
          releaseSeries:
            - major: $(echo ${VERSION} | cut -d. -f1)
              minor: $(echo ${VERSION} | cut -d. -f2)
              contract: v1beta2
          EOF

      - name: Generate infrastructure-components.yaml
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          helm template cluster-api-provider-evroc helm/cluster-api-provider-evroc \
            --namespace capi-evroc-system \
            --set controller.image.tag=${VERSION} \
            --set fullnameOverride=cluster-api-provider-evroc \
            --set namespace.create=true \
            --include-crds \
            > infrastructure-components.yaml

      - name: Sign release manifests
        run: |
          for artifact in \
            infrastructure-components.yaml \
            clusterctl-metadata/metadata.yaml \
            templates/cluster-template*.yaml; do
            cosign sign-blob --yes "$artifact" --bundle "$artifact.bundle"
          done

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          VERSION_NO_V=${{ steps.get_version.outputs.VERSION_NO_V }}
          REPO=${{ github.repository }}

          # Extract changelog for this version
          if grep -q "## \[${VERSION_NO_V}\]" CHANGELOG.md 2>/dev/null; then
            NOTES=$(sed -n "/## \[${VERSION_NO_V}\]/,/## \[/p" CHANGELOG.md | sed '$d')
          else
            NOTES="Release ${VERSION}

          ## What's Changed

          See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for details.

          ## Installation

          ### Using clusterctl

          \`\`\`bash
          clusterctl init --infrastructure evroc
          \`\`\`

          ### Using Helm

          \`\`\`bash
          helm install evroc-provider oci://ghcr.io/${{ github.repository_owner }}/charts/cluster-api-provider-evroc --version ${VERSION#v}
          \`\`\`

          ## Container Images

          - \`ghcr.io/${REPO}:${VERSION}\`
          - Signed with Cosign (keyless)
          - SBOM and SLSA provenance attestations available

          ## Verification

          Verify the image signature:

          \`\`\`bash
          cosign verify ghcr.io/${REPO}:${VERSION} \
            --certificate-identity=https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION} \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          \`\`\`"
          fi

          # Write to file to handle multiline
          echo "$NOTES" > release_notes.txt

      - name: Log in to GitHub Container Registry for Helm
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to GHCR OCI registry
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          cd helm
          helm push cluster-api-provider-evroc-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          cd ..

      # GitHub CLI: Creates GitHub release only after every package is published.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.txt \
            helm/cluster-api-provider-evroc-*.tgz \
            helm/cluster-api-provider-evroc-*.tgz.bundle \
            infrastructure-components.yaml \
            infrastructure-components.yaml.bundle \
            clusterctl-metadata/metadata.yaml \
            clusterctl-metadata/metadata.yaml.bundle \
            templates/cluster-template*.yaml \
            templates/cluster-template*.yaml.bundle
